<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Jordan Foltz — Data Analyst">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6420"/>
      <stop offset="1" stop-color="#2d5016"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e4a6"/>
      <stop offset="1" stop-color="#d4af37"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square brand tile -->
  <rect x="0" y="0" width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Normal distribution rendered as a histogram -->
  <g fill="url(#bar)">
    <rect x="4.6"  y="22.8" width="2.4" height="2.2"  rx="0.8"/>
    <rect x="8.0"  y="18.5" width="2.4" height="6.5"  rx="0.8"/>
    <rect x="11.4" y="11.0" width="2.4" height="14.0" rx="0.8"/>
    <rect x="14.8" y="7.0"  width="2.4" height="18.0" rx="0.8"/>
    <rect x="18.2" y="11.0" width="2.4" height="14.0" rx="0.8"/>
    <rect x="21.6" y="18.5" width="2.4" height="6.5"  rx="0.8"/>
    <rect x="25.0" y="22.8" width="2.4" height="2.2"  rx="0.8"/>
  </g>

  <!-- Baseline axis -->
  <line x1="3.5" y1="25" x2="28.5" y2="25" stroke="#d4af37" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>
</svg>
